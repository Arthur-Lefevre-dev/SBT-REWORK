<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil Steam – Ban Tracker</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <h1><a href="/" class="header-home-link">Steam Ban Tracker</a></h1>
      <p class="subtitle">Profil</p>
    </header>

    <main class="profile-page">
      <div id="profile-loading" class="profile-loading">
        Chargement du profil…
      </div>
      <div id="profile-error" class="profile-error" style="display: none"></div>
      <div id="profile-content" style="display: none">
        <div class="profile-panel">
          <h2>Profil</h2>
          <div class="profile-header-wrap">
            <img id="profile-avatar" class="profile-avatar" src="" alt="" />
            <div>
              <h1 id="profile-name" class="profile-name"></h1>
              <p id="profile-meta" class="profile-meta"></p>
            </div>
          </div>
          <div class="profile-stats">
            <div class="profile-stat">
              <span id="profile-friends" class="stat-value">—</span>
              <span class="stat-label">Amis (connus)</span>
            </div>
            <div class="profile-stat">
              <span id="profile-friends-banned" class="stat-value">—</span>
              <span
                id="profile-friends-banned-detail"
                class="stat-detail"
                style="display: none"
              ></span>
              <span class="stat-label">Amis bannis</span>
            </div>
            <div class="profile-stat">
              <span id="profile-vac" class="stat-value">—</span>
              <span class="stat-label">VAC</span>
            </div>
            <div class="profile-stat">
              <span id="profile-game" class="stat-value">—</span>
              <span
                id="profile-game-detail"
                class="stat-detail"
                style="display: none"
              ></span>
              <span class="stat-label">Game bans</span>
            </div>
            <div class="profile-stat">
              <span id="profile-community" class="stat-value">—</span>
              <span class="stat-label">Community</span>
            </div>
            <div class="profile-stat" id="profile-leetify-stat">
              <span id="profile-leetify-winrate" class="stat-value">—</span>
              <span class="stat-label">Winrate Leetify</span>
            </div>
            <div class="profile-stat" id="profile-leetify-matches-stat">
              <span id="profile-leetify-matches" class="stat-value">—</span>
              <span class="stat-label">Matchs Leetify</span>
            </div>
            <div class="profile-stat" id="profile-leetify-premier-stat">
              <span id="profile-leetify-premier" class="stat-value">—</span>
              <span class="stat-label">Premier</span>
            </div>
            <div class="profile-stat" id="profile-leetify-wingman-stat">
              <span id="profile-leetify-wingman" class="stat-value">—</span>
              <span class="stat-label">Wingman</span>
            </div>
            <div class="profile-stat" id="profile-leetify-renown-stat">
              <span id="profile-leetify-renown" class="stat-value">—</span>
              <span class="stat-label">Renown</span>
            </div>
            <div class="profile-stat" id="profile-elo-stat">
              <img
                id="profile-elo-badge"
                class="profile-elo-badge"
                src=""
                alt=""
                style="display: none"
              />
              <span id="profile-elo" class="stat-value">—</span>
              <span class="stat-label">ELO Faceit</span>
            </div>
            <div class="profile-stat" id="profile-leetify-rating-num-stat">
              <span id="profile-leetify-rating-num" class="stat-value">—</span>
              <span class="stat-label">Rating Leetify</span>
            </div>
          </div>
          <p
            id="profile-scraped-at"
            class="profile-scraped-at"
            style="display: none"
          ></p>
          <div
            id="profile-leetify-rating-wrap"
            class="profile-leetify-rating-wrap"
            style="display: none"
          ></div>
          <div
            id="profile-leetify-stats-wrap"
            class="profile-leetify-stats-wrap"
            style="display: none"
          ></div>
          <div
            id="profile-leetify-matches-wrap"
            class="profile-leetify-matches-wrap"
            style="display: none"
          >
            <h3 class="profile-leetify-matches-title">10 derniers matchs (Leetify)</h3>
            <div id="profile-leetify-matches-list" class="profile-leetify-matches-list"></div>
          </div>
          <div
            id="profile-leetify-attribution-wrap"
            class="profile-leetify-attribution-wrap"
            style="display: none"
          >
            <span class="profile-leetify-attribution-text"
              >Data provided by</span
            >
            <a
              href="https://leetify.com"
              target="_blank"
              rel="noopener"
              class="profile-leetify-attribution-logo"
              ><img src="/img/static/Leetify.png" alt="Leetify"
            /></a>
          </div>
          <div
            id="profile-friends-banned-list-wrap"
            class="profile-friends-banned-wrap"
            style="display: none"
          >
            <h3 class="profile-friends-banned-title">Amis bannis</h3>
            <ul
              id="profile-friends-banned-list"
              class="profile-friends-banned-list"
            ></ul>
            <div
              id="profile-friends-banned-pagination"
              class="profile-friends-banned-pagination"
              style="display: none"
            >
              <span id="profile-friends-banned-range" class="profile-friends-banned-range"></span>
              <div class="profile-friends-banned-buttons">
                <button type="button" id="profile-friends-banned-prev" class="profile-friends-banned-btn" aria-label="Précédent">Précédent</button>
                <button type="button" id="profile-friends-banned-next" class="profile-friends-banned-btn" aria-label="Suivant">Suivant</button>
              </div>
            </div>
          </div>
          <div class="profile-links-wrap">
            <div class="profile-links" id="profile-links"></div>
          </div>
        </div>
      </div>
    </main>

    <footer>made by Drago</footer>

    <script>
      (function () {
        const pathParts = window.location.pathname.split("/").filter(Boolean);
        const steamid64 = pathParts[pathParts.length - 1];
        if (!steamid64 || steamid64 === "profile") {
          document.getElementById("profile-loading").style.display = "none";
          document.getElementById("profile-error").style.display = "block";
          document.getElementById("profile-error").textContent =
            "URL de profil invalide.";
          return;
        }

        const loadingEl = document.getElementById("profile-loading");
        const errorEl = document.getElementById("profile-error");
        const contentEl = document.getElementById("profile-content");

        fetch("/api/profile/" + encodeURIComponent(steamid64))
          .then(function (res) {
            if (!res.ok)
              throw new Error(
                res.status === 404 ? "Profil non trouvé" : res.statusText,
              );
            return res.json();
          })
          .then(function (data) {
            loadingEl.style.display = "none";
            errorEl.style.display = "none";
            contentEl.style.display = "block";

            document.getElementById("profile-name").textContent =
              data.persona_name || "Unknown";
            var metaParts = [data.steamid64];
            if (data.steamid) metaParts.push(data.steamid);
            document.getElementById("profile-meta").textContent =
              metaParts.join(" · ");
            const avatar = document.getElementById("profile-avatar");
            avatar.src = data.avatar || "";
            avatar.alt = data.persona_name || "";

            var scrapedEl = document.getElementById("profile-scraped-at");
            if (scrapedEl && data.scraped_at) {
              try {
                scrapedEl.textContent =
                  "Dernière mise à jour : " +
                  new Date(data.scraped_at).toLocaleString("fr-FR", {
                    dateStyle: "short",
                    timeStyle: "short",
                  });
                scrapedEl.style.display = "block";
              } catch (e) {
                scrapedEl.style.display = "none";
              }
            } else if (scrapedEl) {
              scrapedEl.style.display = "none";
            }

            document.getElementById("profile-friends").textContent =
              data.friend_count != null ? String(data.friend_count) : "—";
            var friendsBannedEl = document.getElementById(
              "profile-friends-banned",
            );
            var friendsBannedDetailEl = document.getElementById(
              "profile-friends-banned-detail",
            );
            if (friendsBannedEl) {
              if (
                data.friend_ban_percentage != null &&
                data.friend_count != null &&
                data.friend_count > 0
              ) {
                var banned =
                  data.friend_banned_count != null
                    ? data.friend_banned_count
                    : 0;
                friendsBannedEl.textContent = data.friend_ban_percentage + " %";
                if (friendsBannedDetailEl) {
                  friendsBannedDetailEl.textContent =
                    "(" + banned + " / " + data.friend_count + ")";
                  friendsBannedDetailEl.style.display = "";
                }
              } else {
                friendsBannedEl.textContent = "—";
                if (friendsBannedDetailEl)
                  friendsBannedDetailEl.style.display = "none";
              }
            }
            var isVacBanned = data.vac_banned === 1 || data.vac_banned === true;
            document.getElementById("profile-vac").textContent = isVacBanned
              ? String(data.vac_count != null ? data.vac_count : 1)
              : "0";
            document.getElementById("profile-game").textContent =
              data.game_ban_count != null ? String(data.game_ban_count) : "0";
            var gameDetailEl = document.getElementById("profile-game-detail");
            if (gameDetailEl) {
              if (data.game_ban_days_since_last != null) {
                gameDetailEl.textContent =
                  "(il y a " + data.game_ban_days_since_last + " j)";
                gameDetailEl.style.display = "";
              } else {
                gameDetailEl.style.display = "none";
              }
            }
            var isCommunityBanned =
              data.community_banned === 1 || data.community_banned === true;
            document.getElementById("profile-community").textContent =
              isCommunityBanned ? "Oui" : "Non";
            var eloVal =
              data.faceit_elo != null ? String(data.faceit_elo) : "—";
            document.getElementById("profile-elo").textContent = eloVal;
            var eloStatEl = document.getElementById("profile-elo-stat");
            var eloBadgeEl = document.getElementById("profile-elo-badge");
            if (eloStatEl) {
              eloStatEl.classList.remove(
                "faceit-lvl-1",
                "faceit-lvl-2",
                "faceit-lvl-3",
                "faceit-lvl-4",
                "faceit-lvl-5",
                "faceit-lvl-6",
                "faceit-lvl-7",
                "faceit-lvl-8",
                "faceit-lvl-9",
                "faceit-lvl-10",
              );
              var level = null;
              if (data.faceit_skill_level != null)
                level = Math.max(
                  1,
                  Math.min(10, parseInt(data.faceit_skill_level, 10)),
                );
              else if (data.faceit_elo != null)
                level = eloToLevel(data.faceit_elo);
              if (level >= 1 && level <= 10) {
                eloStatEl.classList.add("faceit-lvl-" + level);
                if (eloBadgeEl) {
                  eloBadgeEl.src = "/img/faceit/" + level + ".png";
                  eloBadgeEl.alt = "Faceit Level " + level;
                  eloBadgeEl.style.display = "";
                  eloBadgeEl.onerror = function () {
                    this.style.display = "none";
                  };
                }
              } else if (eloBadgeEl) {
                eloBadgeEl.src = "";
                eloBadgeEl.style.display = "none";
              }
            }

            function eloToLevel(elo) {
              if (elo < 800) return 1;
              if (elo < 900) return 2;
              if (elo < 1000) return 3;
              if (elo < 1100) return 4;
              if (elo < 1200) return 5;
              if (elo < 1300) return 6;
              if (elo < 1400) return 7;
              if (elo < 1500) return 8;
              if (elo < 2000) return 9;
              return 10;
            }

            const steamUrl = "https://steamcommunity.com/profiles/" + steamid64;
            const faceitName = (data.persona_name || "").replace(/\s+/g, "_");
            const faceitUrl =
              data.faceit_url ||
              "https://www.faceit.com/en/players/" +
                encodeURIComponent(faceitName);
            const friendsUrl = data.friends_page_url || steamUrl + "/friends/";

            var linksHtml =
              '<a href="' +
              steamUrl +
              '" target="_blank" rel="noopener">Profil Steam</a>' +
              '<a href="' +
              friendsUrl +
              '" target="_blank" rel="noopener">Amis Steam</a>' +
              '<a href="' +
              faceitUrl +
              '" target="_blank" rel="noopener">Faceit</a>';
            if (data.leetify && data.leetify.profile_url) {
              linksHtml +=
                '<a href="' +
                data.leetify.profile_url.replace(/"/g, "&quot;") +
                '" target="_blank" rel="noopener">Leetify</a>';
            }
            document.getElementById("profile-links").innerHTML = linksHtml;

            // Amis bannis (run first so it is never skipped by errors below)
            var friendsBannedListWrap = document.getElementById(
              "profile-friends-banned-list-wrap",
            );
            var friendsBannedList = document.getElementById(
              "profile-friends-banned-list",
            );
            var FRIENDS_BANNED_PAGE_SIZE = 10;
            var friendsBannedData = data.friends_banned || [];
            var friendsBannedCurrentPage = 1;

            function renderFriendRow(f) {
              var badges = [];
              if (f.vac_banned === 1 || f.vac_banned === true)
                badges.push('<span class="badge-ban badge-vac">VAC</span>');
              if (f.game_ban_count > 0)
                badges.push('<span class="badge-ban badge-game">Game</span>');
              if (f.community_banned === 1 || f.community_banned === true)
                badges.push(
                  '<span class="badge-ban badge-community">Community</span>',
                );
              var profileUrl = "/profile/" + encodeURIComponent(f.steamid64);
              var name = (f.persona_name || f.steamid64 || "Unknown")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
              var avatar = (f.avatar || "").replace(/"/g, "&quot;");
              return (
                '<li class="profile-friend-banned-item">' +
                '<a href="' +
                profileUrl +
                '" class="profile-friend-banned-link">' +
                '<img class="profile-friend-banned-avatar" src="' +
                avatar +
                '" alt="" onerror="this.style.display=\'none\'" />' +
                '<span class="profile-friend-banned-name">' +
                name +
                "</span>" +
                (badges.length
                  ? ' <span class="profile-friend-banned-badges">' +
                    badges.join(" ") +
                    "</span>"
                  : "") +
                "</a></li>"
              );
            }

            function renderFriendsBannedPage(page) {
              if (!friendsBannedList) return;
              var total = friendsBannedData.length;
              var totalPages = Math.max(1, Math.ceil(total / FRIENDS_BANNED_PAGE_SIZE));
              var p = Math.max(1, Math.min(page, totalPages));
              friendsBannedCurrentPage = p;
              var start = (p - 1) * FRIENDS_BANNED_PAGE_SIZE;
              var end = Math.min(start + FRIENDS_BANNED_PAGE_SIZE, total);
              var pageData = friendsBannedData.slice(start, end);
              friendsBannedList.innerHTML = pageData.map(renderFriendRow).join("");

              var paginationWrap = document.getElementById(
                "profile-friends-banned-pagination",
              );
              var rangeEl = document.getElementById(
                "profile-friends-banned-range",
              );
              var prevBtn = document.getElementById(
                "profile-friends-banned-prev",
              );
              var nextBtn = document.getElementById(
                "profile-friends-banned-next",
              );
              if (total > FRIENDS_BANNED_PAGE_SIZE && paginationWrap) {
                paginationWrap.style.display = "flex";
                if (rangeEl)
                  rangeEl.textContent =
                    "Affichage " +
                    (start + 1) +
                    "–" +
                    end +
                    " sur " +
                    total;
                if (prevBtn) {
                  prevBtn.disabled = p <= 1;
                  prevBtn.onclick = function () {
                    renderFriendsBannedPage(p - 1);
                  };
                }
                if (nextBtn) {
                  nextBtn.disabled = p >= totalPages;
                  nextBtn.onclick = function () {
                    renderFriendsBannedPage(p + 1);
                  };
                }
              } else if (paginationWrap) {
                paginationWrap.style.display = "none";
              }
            }

            if (
              friendsBannedListWrap &&
              friendsBannedList &&
              friendsBannedData.length > 0
            ) {
              friendsBannedListWrap.style.display = "block";
              renderFriendsBannedPage(1);
            } else if (friendsBannedListWrap) {
              friendsBannedListWrap.style.display = "none";
            }

            // Leetify stats (only show when we have data)
            var leetify = data.leetify;
            var winrateEl = document.getElementById("profile-leetify-winrate");
            var matchesEl = document.getElementById("profile-leetify-matches");
            var premierEl = document.getElementById("profile-leetify-premier");
            var winrateStat = document.getElementById("profile-leetify-stat");
            var matchesStat = document.getElementById(
              "profile-leetify-matches-stat",
            );
            var premierStat = document.getElementById(
              "profile-leetify-premier-stat",
            );
            if (leetify) {
              if (winrateEl)
                winrateEl.textContent =
                  leetify.winrate != null ? leetify.winrate + " %" : "—";
              if (matchesEl)
                matchesEl.textContent =
                  leetify.total_matches != null
                    ? String(leetify.total_matches)
                    : "—";
              function getPremierTierClass(r) {
                if (r >= 30000) return "premier-gold";
                if (r >= 25000) return "premier-red";
                if (r >= 20000) return "premier-pink";
                if (r >= 15000) return "premier-purple";
                if (r >= 10000) return "premier-blue";
                if (r >= 5000) return "premier-light-blue";
                return "premier-gray";
              }
              var premierTiers = [
                "premier-gray",
                "premier-light-blue",
                "premier-blue",
                "premier-purple",
                "premier-pink",
                "premier-red",
                "premier-gold",
              ];
              if (premierStat)
                premierStat.classList.remove.apply(
                  premierStat.classList,
                  premierTiers,
                );
              if (premierEl) {
                if (leetify.ranks && leetify.ranks.premier != null) {
                  var pr = Math.round(leetify.ranks.premier);
                  premierEl.textContent = pr.toLocaleString("fr-FR");
                  if (premierStat)
                    premierStat.classList.add(getPremierTierClass(pr));
                } else {
                  premierEl.textContent = "—";
                }
              }
              var wingmanEl = document.getElementById("profile-leetify-wingman");
              var ratingNumEl = document.getElementById("profile-leetify-rating-num");
              var renownEl = document.getElementById("profile-leetify-renown");
              if (wingmanEl) wingmanEl.textContent = (leetify.ranks && leetify.ranks.wingman != null) ? String(leetify.ranks.wingman) : "—";
              if (ratingNumEl) ratingNumEl.textContent = (leetify.ranks && leetify.ranks.leetify_rating != null) ? Math.round(leetify.ranks.leetify_rating) : "—";
              if (renownEl) renownEl.textContent = (leetify.ranks && leetify.ranks.renown != null) ? String(leetify.ranks.renown) : "—";
              var statsWrap = document.getElementById("profile-leetify-stats-wrap");
              if (statsWrap && leetify.stats && (leetify.stats.reaction_time_ms != null || leetify.stats.accuracy_head != null || leetify.stats.preaim != null || leetify.stats.spray_accuracy != null)) {
                function formatPct(v) {
                  if (v == null) return "—";
                  var n = Number(v);
                  if (n >= 0 && n <= 1) n = n * 100;
                  return (Math.round(n * 10) / 10).toFixed(1).replace(".", ",") + " %";
                }
                function formatMs(v) {
                  if (v == null) return "—";
                  var n = Number(v);
                  if (n > 0 && n < 1) n = n * 1000;
                  return Math.round(n) + " ms";
                }
                function pctRaw(v) {
                  if (v == null) return null;
                  var n = Number(v);
                  if (n >= 0 && n <= 1) n = n * 100;
                  return n;
                }
                function msRaw(v) {
                  if (v == null) return null;
                  var n = Number(v);
                  if (n > 0 && n < 1) n = n * 1000;
                  return n;
                }
                function formatDeg(v) {
                  if (v == null) return "—";
                  var n = Number(v);
                  return (Math.round(n * 10) / 10).toFixed(1).replace(".", ",") + " °";
                }
                function statLevel(key, raw) {
                  if (raw == null) return "mid";
                  if (key === "reaction") {
                    if (raw <= 500) return "good";
                    if (raw <= 650) return "mid";
                    return "bad";
                  }
                  if (key === "preaim") {
                    if (raw <= 9) return "good";
                    if (raw <= 13) return "mid";
                    return "bad";
                  }
                  if (key === "head") {
                    if (raw >= 25) return "good";
                    if (raw >= 15) return "mid";
                    return "bad";
                  }
                  var pct = raw;
                  if (pct >= 60) return "good";
                  if (pct >= 40) return "mid";
                  return "bad";
                }
                var items = [];
                if (leetify.stats.reaction_time_ms != null) {
                  var r = msRaw(leetify.stats.reaction_time_ms);
                  items.push({ label: "Réaction", value: formatMs(leetify.stats.reaction_time_ms), key: "reaction", raw: r, level: statLevel("reaction", r) });
                }
                if (leetify.stats.accuracy_head != null) {
                  var h = pctRaw(leetify.stats.accuracy_head);
                  items.push({ label: "Head", value: formatPct(leetify.stats.accuracy_head), key: "head", raw: h, level: statLevel("head", h) });
                }
                if (leetify.stats.preaim != null) {
                  var p = Number(leetify.stats.preaim);
                  items.push({ label: "Preaim", value: formatDeg(leetify.stats.preaim), key: "preaim", raw: p, level: statLevel("preaim", p) });
                }
                if (leetify.stats.spray_accuracy != null) {
                  var s = pctRaw(leetify.stats.spray_accuracy);
                  items.push({ label: "Spray", value: formatPct(leetify.stats.spray_accuracy), key: "pct", raw: s, level: statLevel("pct", s) });
                }
                var gridHtml = items.map(function (i) { return "<div class=\"profile-leetify-stat-item leetify-stat-" + i.level + "\"><span class=\"profile-leetify-stat-item-label\">" + i.label + "</span><span class=\"profile-leetify-stat-item-value\">" + i.value + "</span></div>"; }).join("");
                statsWrap.innerHTML = "<h4 class=\"profile-leetify-stats-title\">Stats Leetify</h4><div class=\"profile-leetify-stats-grid\">" + gridHtml + "</div>";
                statsWrap.style.display = "block";
              } else if (statsWrap) statsWrap.style.display = "none";
              var matchesWrap = document.getElementById("profile-leetify-matches-wrap");
              var matchesListEl = document.getElementById("profile-leetify-matches-list");
              if (matchesWrap && matchesListEl && leetify.recent_matches && leetify.recent_matches.length > 0) {
                function platformLabel(ds) {
                  if (!ds) return "—";
                  var s = String(ds).toLowerCase();
                  if (s === "faceit") return "Faceit";
                  if (s === "matchmaking") return "Matchmaking";
                  return ds;
                }
                var matchRows = leetify.recent_matches.map(function (m) {
                  var dateStr = "—";
                  if (m.finished_at) try { dateStr = new Date(m.finished_at).toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }); } catch (e) {}
                  var scoreStr = Array.isArray(m.score) && m.score.length >= 2 ? m.score[0] + " – " + m.score[1] : "—";
                  var outcome = m.outcome ? (String(m.outcome).toLowerCase() === "win" ? "Victoire" : "Défaite") : "—";
                  var mapName = (m.map_name || "—").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                  return "<tr><td class=\"profile-leetify-match-platform\">" + platformLabel(m.data_source) + "</td><td class=\"profile-leetify-match-map\">" + mapName + "</td><td class=\"profile-leetify-match-outcome\">" + outcome + "</td><td class=\"profile-leetify-match-score\">" + scoreStr + "</td><td class=\"profile-leetify-match-date\">" + dateStr + "</td></tr>";
                });
                matchesListEl.innerHTML = "<table class=\"profile-leetify-matches-table\"><thead><tr><th>Plateforme</th><th>Map</th><th>Résultat</th><th>Score</th><th>Date</th></tr></thead><tbody>" + matchRows.join("") + "</tbody></table>";
                matchesWrap.style.display = "block";
              } else if (matchesWrap) matchesWrap.style.display = "none";
              // Leetify rating breakdown – bar chart (aim, positioning, utility, clutch, opening), scale 0–100
              var rating = leetify.rating;
              var ratingWrap = document.getElementById(
                "profile-leetify-rating-wrap",
              );
              if (
                ratingWrap &&
                rating &&
                (rating.aim != null ||
                  rating.positioning != null ||
                  rating.utility != null ||
                  rating.clutch != null ||
                  rating.opening != null)
              ) {
                var items = [
                  { key: "aim", label: "Aim", value: rating.aim },
                  {
                    key: "positioning",
                    label: "Position",
                    value: rating.positioning,
                  },
                  { key: "utility", label: "Utility", value: rating.utility },
                  { key: "clutch", label: "Clutch", value: rating.clutch },
                  { key: "opening", label: "Opening", value: rating.opening },
                ];
                var ratingMax = 100;
                function levelClass(pct) {
                  if (pct >= 60) return "leetify-good";
                  if (pct >= 40) return "leetify-mid";
                  return "leetify-bad";
                }
                var html =
                  '<h3 class="profile-leetify-rating-title">Rating Leetify</h3><div class="profile-leetify-bars">';
                items.forEach(function (item) {
                  if (item.value == null) return;
                  var v = Number(item.value);
                  if (v <= 1 && v >= 0) v = v * 100;
                  var pct = Math.min(100, Math.max(0, (v / ratingMax) * 100));
                  var rounded = Math.round(v);
                  var level = levelClass(pct);
                  html +=
                    '<div class="profile-leetify-bar-row ' +
                    level +
                    '" data-metric="' +
                    item.key +
                    '">' +
                    '<span class="profile-leetify-bar-label">' +
                    item.label +
                    "</span>" +
                    '<div class="profile-leetify-bar-track"><div class="profile-leetify-bar-fill ' +
                    level +
                    '" style="width:' +
                    pct +
                    '%"></div></div>' +
                    '<span class="profile-leetify-bar-value">' +
                    rounded +
                    " %</span></div>";
                });
                html += "</div>";
                ratingWrap.innerHTML = html;
                ratingWrap.style.display = "block";
              } else if (ratingWrap) {
                ratingWrap.style.display = "none";
              }
              var leetifyAttributionWrap = document.getElementById(
                "profile-leetify-attribution-wrap",
              );
              if (leetifyAttributionWrap)
                leetifyAttributionWrap.style.display = "flex";
            } else {
              if (winrateEl) winrateEl.textContent = "—";
              if (matchesEl) matchesEl.textContent = "—";
              if (premierEl) premierEl.textContent = "—";
              if (premierStat)
                premierStat.classList.remove(
                  "premier-gray",
                  "premier-light-blue",
                  "premier-blue",
                  "premier-purple",
                  "premier-pink",
                  "premier-red",
                  "premier-gold",
                );
              var leetifyAttributionWrap = document.getElementById(
                "profile-leetify-attribution-wrap",
              );
              if (leetifyAttributionWrap)
                leetifyAttributionWrap.style.display = "none";
            }

          })
          .catch(function (err) {
            loadingEl.style.display = "none";
            errorEl.style.display = "block";
            errorEl.textContent = err.message || "Erreur de chargement.";
          });
      })();
    </script>
  </body>
</html>
